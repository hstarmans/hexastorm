[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hexastorm"
version = "0.1.0"
description = "amaranth framework for writing to a substrate with a laser"
authors = [
    { name = "Rik Starmans", email = "hstarmans@hexastorm.com" }
]
license = { file = "LICENSE.txt" }
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "fire>=0.7.1",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "amaranth-boards",
    "resvg-py",
    "yowasp-nextpnr-ice40>=0.11.1.0.post826",
    "yowasp-yosys>=0.71.0.0.post1285",
    "matplotlib>=3.11.2",
    "pyserial>=3.5",
]

[project.optional-dependencies]
camera = [
    "opencv-python>=5.1.0.95; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "opencv-python>=4.11.0,<4.12; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]


[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PLE", "PLW"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/calibration/*.py" = ["E402"]
"tests/camera/test_optical.py" = ["PLW0602", "PLW0603"]
"tests/esp32/test_esp32.py" = ["PLW0602", "PLW0603"]
"src/hexastorm/fpga_host/micropython.py" = ["B904"]

[tool.ruff.format]
quote-style = "double"

[tool.uv.sources]
amaranth-boards = { git = "https://github.com/amaranth-lang/amaranth-boards.git", rev = "main" }

[project.scripts]
cam = "tests.camera.test_optical:main"
pat_cross_scan = "hexastorm.exposure.patterns.cross_scan:main"
pat_machine = "hexastorm.exposure.patterns.machine:main"
pat_cam = "hexastorm.exposure.patterns.camera:main"
exposure = "hexastorm.exposure.engine:main"
build = "hexastorm.build:main"

[tool.setuptools]
package-dir = {"" = "src", "tests" = "tests"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["hexastorm*", "tests*", "ulab*", "machine*", "tmc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["subprojects", ".venv", "build", "output"]
addopts = "--ignore=tests/camera/test_optical.py --ignore=tests/esp32/test_esp32.py --ignore=tests/fpga/test_build.py"


